[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamilbook"
version = "0.1.0"
description = "Convert Tamil PDF books (scanned or digital) to EPUB/TXT for e-readers, with word-by-word QA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "ebooklib>=0.18",
  "pytesseract>=0.3.10",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tamilbook = "tamilbook.cli:main"

[tool.setuptools]
packages = ["tamilbook"]
