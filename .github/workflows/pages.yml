# Publishes library/ as a free website on GitHub Pages:
#   https://<user>.github.io/<repo>/   (+ /opds.xml for e-reader apps)
# Enable once: Settings -> Pages -> Source: "GitHub Actions".
name: publish library
on:
  push:
    branches: [main]
    paths: ["library/**", "tamilbook/site.py"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: >
          python -m tamilbook site library -o site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
